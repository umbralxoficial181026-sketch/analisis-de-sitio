  --bg:#0E1317; --paper:#151C21; --ink:#E4EAEC; --muted:#93A1AA; --line:#2A353C; --line-2:#212A30;
  --accent:#8EA2FF; --accent-ink:#0E1317; --accent-soft:#1D2547; --sun:#F2B23E; --sun-soft:#3A2C12;
  --ok:#5FBF86; --warn:#E3AE52; --bad:#EE7A6E; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.proj{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px}
.proj input{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:var(--r);font-weight:600}
.proj input:hover{border-color:var(--line)}
.proj input:focus{border-color:var(--accent);background:var(--bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,58px));z-index:19;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail::-webkit-scrollbar{display:none}
.rail a{display:flex;align-items:baseline;gap:5px;padding:9px 10px 8px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.rail a i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:500;opacity:.8}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.view{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.view.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.view{grid-template-columns:minmax(0,1fr)}}

.head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.head h1 span{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);vertical-align:top;margin-right:8px}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}

.board{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.board-bar .ttl{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.fig{padding:10px;overflow-x:auto}
.fig > svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.fig.scroll > svg{min-width:640px}
.stack{display:grid;gap:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}

.panel{display:grid;gap:14px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.card h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.fields .full{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 8px;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);min-width:0;width:100%}
label.f textarea{resize:vertical;min-height:62px;line-height:1.4}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--accent);outline:none}
.range{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px}
.range span:first-child{font-weight:600;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.03em;min-width:64px}
.range input{width:100%;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);font-size:12px;min-width:58px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--paper);padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:clamp(20px,2.1vw,26px);white-space:nowrap;font-weight:600;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td:first-child{font-family:var(--f-body);font-weight:600}
table.t input{width:58px;border:1px solid transparent;background:transparent;text-align:right;font-family:var(--f-mono);font-size:12.5px;padding:2px 4px;border-radius:4px}
table.t input:hover{border-color:var(--line)}
table.t input:focus{border-color:var(--accent);background:var(--bg);outline:none}
table.t tr.sel td{background:var(--accent-soft)}
table.t td.txt{font-family:var(--f-body);text-align:left;white-space:normal}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}
.pill.warn{color:var(--warn);border-color:currentColor}
.pill.bad{color:var(--bad);border-color:currentColor}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.list{display:grid;gap:4px;max-height:360px;overflow:auto}
.li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.li:hover{background:var(--bg)}
.li.sel{background:var(--accent-soft)}
.li .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.strat{display:grid;gap:6px}
.strat div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:12.5px;align-items:start;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.strat b{font-family:var(--f-display);font-size:14px;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:var(--r);font-size:13px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);color:var(--ink)}
.badge{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--sun-soft);color:var(--ink);font-weight:500}
.foot{margin-top:28px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{font-family:var(--f-body)}
svg .dr{cursor:grab}
svg .dr:active{cursor:grabbing}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2: menús, ventanas, herramientas, tutorial ===== */
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{min-width:34px;justify-content:center;font-size:16px;padding:4px 8px}
.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:230px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.16);padding:4px;display:grid}
.menu.right,.board-bar .menu{left:auto;right:0}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.menu button small{font-weight:400;color:var(--muted);font-size:11.5px}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(10,16,22,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);color:var(--ink);border-radius:10px;border:1px solid var(--line);width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px;position:sticky;top:0;background:var(--paper)}
.modal-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.01em}
.modal-b{padding:4px 16px 18px}
.exp-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.exp-i{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;cursor:pointer;color:var(--ink)}
.exp-i:hover,.exp-i:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.exp-i b{font-size:14px}.exp-i span{font-size:12px;color:var(--muted)}
.exp-i:disabled{opacity:.5;cursor:wait}
.pop{position:fixed;z-index:70;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:8px;display:grid;gap:8px;width:min(360px,calc(100vw - 16px))}
.pop-in{border:1px solid var(--accent);border-radius:5px;padding:7px 9px;font-size:14px;background:var(--bg);width:100%;resize:vertical}
svg .edt{cursor:text}
svg .edt:hover{text-decoration:underline;text-decoration-style:dotted}
.tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--bg)}
.tools .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.f.inline{display:flex;align-items:center;gap:6px;margin-left:auto}
.f.inline select{width:auto}
.fig.interactive > svg{touch-action:none;max-height:82vh}
.fig > svg{touch-action:manipulation}
.board-bar .zb .btn{min-width:30px;justify-content:center}
details.sty>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
details.sty>summary::-webkit-details-marker{display:none}
details.sty>summary h3{margin:0}
details.sty>summary::after{content:"+";font-size:18px;color:var(--muted)}
details.sty[open]>summary::after{content:"−"}
details.sty[open]>summary{margin-bottom:10px}
label.f input[type=color]{height:34px;padding:2px;cursor:pointer}
label.f output{font-family:var(--f-mono);font-size:11px;color:var(--ink);margin-left:4px}
.chk.full{grid-column:1/-1}
.sw{display:grid;gap:2px;justify-items:center;font-size:10px;color:var(--muted);width:62px;text-align:center}
.sw input{width:40px;height:30px;border:1px solid var(--line);border-radius:5px;padding:2px;background:none;cursor:pointer}
.sw-in{width:40px;height:32px;border:1px solid var(--line);border-radius:5px;padding:2px;background:none;cursor:pointer}
.zlist{display:grid;gap:6px}
.zrow{display:grid;grid-template-columns:40px minmax(0,1fr) 28px 34px;gap:6px;align-items:center}
.zrow input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:5px;padding:2px;background:none}
.zrow input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 7px;min-width:0}
.zrow .m{text-align:center;font-size:12px;color:var(--muted)}
.tut{position:fixed;inset:0;z-index:80}
.tut-spot{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,16,22,.55);transition:all .25s ease;pointer-events:none;border:2px solid var(--accent)}
.tut-spot[hidden]{display:block!important;width:0!important;height:0!important;left:50%!important;top:50%!important;border:0}
.tut-card{position:fixed;width:min(360px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:grid;gap:6px}
.tut-card h3{margin:0;font-family:var(--f-display);font-size:20px}
.tut-card p{margin:0;font-size:13.5px;line-height:1.5}
.tut-n{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.welcome .exp-i b{font-size:15px}
@media (pointer:coarse){.btn{padding:8px 12px}.btn.sm{padding:7px 10px}.li{padding:9px 8px}}
@media (max-width:640px){.brand small{display:none}.acts{width:100%;justify-content:flex-end}.top-in{gap:8px}.f.inline{margin-left:0}}
@media (max-width:640px){.top{position:static}.rail{top:env(safe-area-inset-top,0px)}}

/* ===== v3: perfil, ajustes, paletas, acabados, 3D, celular ===== */
body[data-finish="soft"] svg .shp{filter:url(#fSoft)}
body[data-finish="sketch"] svg .shp,body[data-finish="sketch"] svg polyline{filter:url(#fSketch)}
svg{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
svg line,svg polyline,svg polygon,svg path{stroke-linejoin:round}
.avb{padding:2px;border-radius:50%;min-width:34px;justify-content:center}
.av{border-radius:50%;object-fit:cover;display:block;flex:none}
.av-t{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;border-radius:50%}
.prof{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prof-av .av,.prof-av .av-t{width:84px!important;height:84px!important;font-size:26px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.set h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.set h4:first-child{margin-top:0}
.pal-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pal{display:grid;gap:6px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);cursor:pointer;color:var(--ink)}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pal b{font-size:12.5px}
.pal-s{display:grid;grid-template-columns:repeat(9,1fr);height:22px;border-radius:4px;overflow:hidden}
.pal-s i{display:block}
.plist{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px}
.foot{align-items:center}
.foot-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink);font-weight:600}
.m3host{padding:0;overflow:hidden;border-radius:0 0 var(--r) var(--r);min-height:260px}
.m3host canvas{display:block;touch-action:none;cursor:grab}
.m3host canvas:active{cursor:grabbing}
.m3wait{padding:20px}
.card.mcol>h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin:0}
.card.mcol>h3::after{content:"−";font-size:18px;color:var(--muted);font-family:var(--f-body)}
.card.mcol.closed>h3::after{content:"+"}
.card.mcol:not(.closed)>h3{margin-bottom:10px}
.card.mcol.closed>:not(h3){display:none}
.menu .mo{display:none}
@media (max-width:700px){
  #btnOpen,#btnSave{display:none}.menu .mo{display:flex}
  .head h1{font-size:26px}.head p{font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:20px}
  .view{gap:12px}.stack,.panel{gap:12px}
  .board-bar{padding:6px 8px}.fig{padding:6px}
  .foot{font-size:11px}
  .tools{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
  .tools .btn{flex:none}
}
.ctxl{display:grid;gap:8px;margin-top:10px}
.ctxr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end;padding:8px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg)}
.ctxr>input[type=text]{grid-column:1/-1;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--paper);font-weight:600;min-width:0}
.ctxr label{display:grid;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ctxr label input{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--paper);font-family:var(--f-mono);font-size:12px;min-width:0;width:100%}
.ctxr [data-del]{justify-self:end}
.mini{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--muted)}

function parseEPW(text,name){

  const wind=Array(13).fill(0).map(()=>Array(16).fill(0).map(()=>[0,0,0,0,0]));// [mes|12=anual][dir][rango]

    const k=m+'-'+d;if(!day[k])day[k]={m,mx:-99,mn:99};day[k].mx=Math.max(day[k].mx,T);day[k].mn=Math.min(day[k].mn,T);
    const p=f.length>33?+f[33]:NaN;if(!isNaN(p)&&p<999){pp[m]+=p;if(p>0)ppOk=true}
    if(ws<40&&wd<=360){const bin=ws<1?0:ws<3?1:ws<5?2:ws<8?3:4;if(bin===0){wind[m][0][0]++;wind[12][0][0]++}else{const di=Math.round(wd/22.5)%16;wind[m][di][bin]++;wind[12][di][bin]++}}
  }

  Object.values(day).forEach(o=>{tmax[o.m].push(o.mx);tmin[o.m].push(o.mn)});

  return{name:(loc[1]||name||'EPW').trim(),lat:+loc[6],lon:+loc[7],tz:+loc[8],elev:+loc[9],monthly,hourT,hourRH,wind};
}

function pathToPolys(d){const t=d.match(/[a-zA-Z]|-?[\d.]+(?:e-?\d+)?/g)||[];let i=0,cx=0,cy=0,sx=0,sy=0,cmd='';const out=[];let cur=null;const num=()=>+t[i++];
  const start=(x,y)=>{cur={pts:[[x,y]],closed:false};out.push(cur)};
  while(i<t.length){if(/[a-zA-Z]/.test(t[i]))cmd=t[i++];const rel=cmd===cmd.toLowerCase();const C=cmd.toUpperCase();
    if(C==='M'){let x=num(),y=num();if(rel){x+=cx;y+=cy}cx=x;cy=y;sx=x;sy=y;start(x,y);cmd=rel?'l':'L'}
    else if(C==='L'){let x=num(),y=num();if(rel){x+=cx;y+=cy}cx=x;cy=y;cur&&cur.pts.push([x,y])}
    else if(C==='H'){let x=num();if(rel)x+=cx;cx=x;cur&&cur.pts.push([cx,cy])}
    else if(C==='V'){let y=num();if(rel)y+=cy;cy=y;cur&&cur.pts.push([cx,cy])}
    else if(C==='Z'){if(cur)cur.closed=true;cx=sx;cy=sy}
    else if(C==='Q'){let x1=num(),y1=num(),x=num(),y=num();if(rel){x1+=cx;y1+=cy;x+=cx;y+=cy}for(let k=1;k<=12;k++){const u=k/12;cur.pts.push([(1-u)**2*cx+2*(1-u)*u*x1+u*u*x,(1-u)**2*cy+2*(1-u)*u*y1+u*u*y])}cx=x;cy=y}
    else if(C==='C'){let x1=num(),y1=num(),x2=num(),y2=num(),x=num(),y=num();if(rel){x1+=cx;y1+=cy;x2+=cx;y2+=cy;x+=cx;y+=cy}for(let k=1;k<=16;k++){const u=k/16,v=1-u;cur.pts.push([v**3*cx+3*v*v*u*x1+3*v*u*u*x2+u**3*x,v**3*cy+3*v*v*u*y1+3*v*u*u*y2+u**3*y])}cx=x;cy=y}

function arcPts(x1,y1,rx,ry,ph,fa,fs,x2,y2){if(!rx||!ry)return[[x2,y2]];const cp=Math.cos(ph),sp=Math.sin(ph);const dx=(x1-x2)/2,dy=(y1-y2)/2;const x1p=cp*dx+sp*dy,y1p=-sp*dx+cp*dy;let l=x1p*x1p/(rx*rx)+y1p*y1p/(ry*ry);if(l>1){rx*=Math.sqrt(l);ry*=Math.sqrt(l)}
  const num=rx*rx*ry*ry-rx*rx*y1p*y1p-ry*ry*x1p*x1p,den=rx*rx*y1p*y1p+ry*ry*x1p*x1p;let co=Math.sqrt(Math.max(0,num/den));if(fa===fs)co=-co;const cxp=co*rx*y1p/ry,cyp=-co*ry*x1p/rx;const cx=cp*cxp-sp*cyp+(x1+x2)/2,cy=sp*cxp+cp*cyp+(y1+y2)/2;
  const ang=(ux,uy,vx,vy)=>{const a=Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy);return a};const t1=ang(1,0,(x1p-cxp)/rx,(y1p-cyp)/ry);let dt=ang((x1p-cxp)/rx,(y1p-cyp)/ry,(-x1p-cxp)/rx,(-y1p-cyp)/ry);if(!fs&&dt>0)dt-=2*Math.PI;if(fs&&dt<0)dt+=2*Math.PI;

function triangulate(poly){const p=poly.map(q=>q.slice());let area=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];area+=a[0]*b[1]-b[0]*a[1]}const idx=p.map((_,i)=>i);if(area<0)idx.reverse();
  const tri=[];const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);const inside=(q,a,b,c)=>cross(a,b,q)>=-1e-12&&cross(b,c,q)>=-1e-12&&cross(c,a,q)>=-1e-12;let guard=0;
  while(idx.length>3&&guard++<500){let cut=false;for(let i=0;i<idx.length;i++){const ia=idx[(i+idx.length-1)%idx.length],ib=idx[i],ic=idx[(i+1)%idx.length];const a=p[ia],b=p[ib],c=p[ic];if(cross(a,b,c)<=1e-12)continue;
    if(idx.some(j=>j!==ia&&j!==ib&&j!==ic&&inside(p[j],a,b,c)))continue;tri.push([ia,ib,ic]);idx.splice(i,1);cut=true;break}if(!cut)break}
  if(idx.length===3)tri.push(idx.slice());return tri}

  const h=Math.max(it.h,0.02),z0=it.z,z1=it.z+h,n=p.length;const v=[...p.map(q=>[q[0],q[1],z0]),...p.map(q=>[q[0],q[1],z1])];const f=[];
  triangulate(p).forEach(([a,b,c])=>{f.push([n+a,n+b,n+c]);f.push([c,b,a])});
  for(let i=0;i<n;i++){const j=(i+1)%n;f.push([i,j,n+j]);f.push([i,n+j,n+i])}

/* DXF: lee polilíneas y líneas y las pone como capa de referencia en la zonificación. */
function parseDXF(t){const L=t.split(/\r?\n/);const pairs=[];for(let i=0;i+1<L.length;i+=2)pairs.push([+L[i].trim(),L[i+1].trim()]);const out=[];let i=0;
  while(i<pairs.length){const[c,v]=pairs[i];if(c===0&&v==='LWPOLYLINE'){const p=[];let closed=false,layer='0',x=null;i++;while(i<pairs.length&&pairs[i][0]!==0){const[cc,vv]=pairs[i];if(cc===8)layer=vv;if(cc===70)closed=(+vv&1)===1;if(cc===10)x=+vv;if(cc===20&&x!=null){p.push([x,+vv]);x=null}i++}out.push({pts:p,closed,layer});continue}
    if(c===0&&v==='POLYLINE'){let closed=false,layer='0';i++;while(i<pairs.length&&pairs[i][0]!==0){if(pairs[i][0]===70)closed=(+pairs[i][1]&1)===1;if(pairs[i][0]===8)layer=pairs[i][1];i++}const p=[];
      while(i<pairs.length&&!(pairs[i][0]===0&&pairs[i][1]==='SEQEND')){if(pairs[i][0]===0&&pairs[i][1]==='VERTEX'){let x=0,y=0;i++;while(i<pairs.length&&pairs[i][0]!==0){if(pairs[i][0]===10)x=+pairs[i][1];if(pairs[i][0]===20)y=+pairs[i][1];i++}p.push([x,y]);continue}i++}out.push({pts:p,closed,layer});continue}
    if(c===0&&v==='LINE'){let a=[0,0],b=[0,0],layer='0';i++;while(i<pairs.length&&pairs[i][0]!==0){const[cc,vv]=pairs[i];if(cc===8)layer=vv;if(cc===10)a[0]=+vv;if(cc===20)a[1]=+vv;if(cc===11)b[0]=+vv;if(cc===21)b[1]=+vv;i++}out.push({pts:[a,b],closed:false,layer});continue}
    i++}
  return out.filter(o=>o.pts.length>1)}
function importDXF(t,name){let ents;try{ents=parseDXF(t)}catch(e){ents=[]}if(!ents.length)return toast('No encontré líneas ni polilíneas en el DXF');
  const all=ents.flatMap(e=>e.pts);const b=bbox(all);const guess=b.w>500?'mm':b.w>50?'cm':'m';
  const body=H(`<div><p style="margin-top:0">Encontré <b>${ents.length}</b> líneas y polilíneas (${f0(b.w)} × ${f0(b.h)} unidades). ¿En qué unidades está dibujado?</p>
    <div class="fields"><label class="f" for="dU">Unidades<select id="dU"><option value="1">Metros</option><option value="0.01">Centímetros</option><option value="0.001">Milímetros</option></select></label>
    <label class="chk" style="align-self:end"><input type="checkbox" id="dO" checked> Llevar al origen del terreno</label></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="dRef" type="button">Usar como referencia</button><button class="btn" id="dSp" type="button">Convertir polígonos cerrados en espacios</button></div>

const RTYPES=[['recp','Recámara principal'],['rec','Recámara'],['est','Estancia / sala'],['com','Comedor'],['estcom','Estancia-comedor'],['coc','Cocina'],['ban','Baño'],['lav','Cuarto de lavado'],['pas','Pasillo / circulación'],['estac','Estacionamiento'],['otro','Otro local habitable'],['ext','Exterior / no habitable']];

function guessType(s){if(s.type)return s.type;const n=norm(s.name);
  if(/principal/.test(n)&&/rec|dorm/.test(n))return'recp';if(/recamara|dormitorio|alcoba|habitacion/.test(n))return'rec';if(/estancia.*comedor|sala.*comedor/.test(n))return'estcom';if(/sala|estancia|estar|living/.test(n))return'est';

/* Normal hacia afuera del lado i de un polígono (coordenadas de planta, y hacia el fondo). */
function edgeInfo(geo,i){const a=geo[i],b=geo[(i+1)%geo.length];const dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;const u=[dx/L,dy/L];const n=ccwPoly(geo)?[u[1],-u[0]]:[-u[1],u[0]];return{a,b,u,n,len:L}}
/* Rumbo (azimut desde el norte) hacia donde mira una normal de planta. */
const bearingOf=n=>((deg(Math.atan2(n[0],n[1]))+(+S.project.northDeg||0))%360+360)%360;
/* Lados que dan al exterior: ningún otro espacio cubierto del mismo nivel los toca por fuera. */
function exteriorEdges(level){const sp=S.spaces.filter(s=>s.geo&&roofed(s)&&(level==null||s.level===level));const out=[];
  sp.forEach(s=>{for(let i=0;i<s.geo.length;i++){const E_=edgeInfo(s.geo,i);if(E_.len<0.05)continue;let ext=0,tot=0;
    for(const t of[0.15,0.5,0.85]){tot++;const q=[E_.a[0]+(E_.b[0]-E_.a[0])*t+E_.n[0]*0.2,E_.a[1]+(E_.b[1]-E_.a[1])*t+E_.n[1]*0.2];if(!sp.some(o=>o!==s&&o.level===s.level&&inPoly(q,o.geo)))ext++}
    if(ext>=2)out.push({s,i,...E_,frac:ext/tot})}});return out}
function openingGeom(o){const s=S.spaces.find(x=>x.id===o.sp);if(!s||!s.geo||o.e>=s.geo.length)return null;const E_=edgeInfo(s.geo,o.e);const w=Math.min(o.w,E_.len);const t=clamp(o.t,w/2/E_.len,1-w/2/E_.len);

function across(o,g){g=g||openingGeom(o);if(!g)return null;const q=[g.c[0]+g.n[0]*0.25,g.c[1]+g.n[1]*0.25];return S.spaces.find(x=>x!==g.s&&x.geo&&x.level===g.s.level&&inPoly(q,x.geo))||null}

/* Horas de sol directo (día 21 de cada mes) en una fachada, separadas en horas calurosas y frescas. */
const SUNCACHE=new Map();
function facadeSun(bearing){const ck=Math.round(bearing)+'|'+S.climate.series+'|'+S.project.lat+'|'+S.project.tz;if(SUNCACHE.has(ck))return SUNCACHE.get(ck);const r=facadeSun0(bearing);SUNCACHE.set(ck,r);return r}
function facadeSun0(bearing){const cs=climateSeries();let hot=0,cool=0,all=0;for(let m=0;m<12;m++){const tn=neutral(cs.tmed[m]);for(let h=5;h<20;h+=0.25){const p=solarPos(m,21,h);if(p.alt<=2)continue;if(Math.abs(angDiff(p.az,bearing))>=88)continue;all+=0.25;const t=hourTemp(m,h,cs);if(t!=null&&t>tn+2.5)hot+=0.25;else if(t!=null&&t<tn-2.5)cool+=0.25}}return{hot:hot/12,cool:cool/12,all:all/12}}
/* Indicadores por local: ventanas, iluminación, ventilación, ventilación cruzada, puertas, sol en ventanas. */
function roomOpenings(s){const ops=S.openings.filter(o=>o.sp===s.id);const extra=S.openings.filter(o=>o.sp!==s.id&&o.type==='door'&&(()=>{const nb=across(o);return nb&&nb.id===s.id})());
  const wins=ops.filter(o=>o.type==='window');const extW=wins.filter(isExteriorOpening);const area=s.geo?polyArea(s.geo):0;const A=extW.reduce((a,o)=>a+Math.min(o.w,openingGeom(o).len)*o.h,0);

  return{wins,extW,doors:ops.filter(o=>o.type==='door').concat(extra),area,winA:A,ilum:area?A/area*100:0,vent:area?A*(S.norm.oper/100)/area*100:0,cross,sun,interiorWins:wins.length-extW.length}}

/* Revisión normativa completa; cada resultado: {grp, s?, msg, st:'ok'|'warn'|'bad', val, req} */
function normChecks(){const N=S.norm,out=[];const add=(grp,st,msg,extra)=>out.push({grp,st,msg,...extra});
  S.spaces.filter(s=>s.geo&&roofed(s)).forEach(s=>{const ty=guessType(s);const r=N.t[ty];if(!r)return;const a=polyArea(s.geo),ms=minSide(s.geo),h=+s.h||0;

    if(r[1]>0)add('dim',ms+1e-6>=r[1]?'ok':(isRect(s.geo)?'bad':'warn'),`${s.name}: lado menor ${f2(ms)} m (mín. ${f2(r[1])})${isRect(s.geo)?'':' · forma irregular, revisa a mano'}`,{s});
    if(r[2]>0&&s.level!=null)add('dim',h+1e-6>=r[2]?'ok':'bad',`${s.name}: altura ${f2(h)} m (mín. ${f2(r[2])})`,{s});
    if(HABIT.includes(ty)||ty==='ban'){const R_=roomOpenings(s);
      if(ty!=='ban')add('luz',R_.ilum+1e-6>=N.ilum?'ok':(R_.wins.length?'bad':'bad'),`${s.name}: iluminación ${f1(R_.ilum)} % del piso (mín. ${N.ilum} %)${R_.wins.length?'':' · sin ventanas'}`,{s});
      add('luz',R_.vent+1e-6>=N.vent?'ok':(ty==='ban'?'warn':'bad'),`${s.name}: ventilación ${f1(R_.vent)} % (mín. ${N.vent} %)${ty==='ban'&&R_.vent<N.vent?' · o extractor mecánico':''}`,{s});
      if(R_.interiorWins)add('luz','warn',`${s.name}: ${R_.interiorWins} ventana(s) en muro interior; no cuentan para iluminar`,{s});
      if(HABIT.includes(ty)&&R_.extW.length)add('luz',R_.cross?'ok':'warn',`${s.name}: ${R_.cross?'tiene':'no tiene'} ventilación cruzada`,{s});
      if(!R_.doors.length)add('acc','warn',`${s.name}: no tiene puerta dibujada`,{s})}
    S.openings.filter(o=>o.sp===s.id&&o.type==='window').forEach(o=>{const g=openingGeom(o);if(!g)return;const L=S.project.lotW,D=S.project.lotL,on=(v,t)=>Math.abs(v-t)<0.05;if((on(g.a[0],0)&&on(g.b[0],0))||(on(g.a[0],L)&&on(g.b[0],L))||(on(g.a[1],D)&&on(g.b[1],D)))add('luz','bad',`${s.name}: ventana sobre la colindancia; la mayoría de los reglamentos no la permite`,{s})});
    if(ty==='pas')add('acc',ms+1e-6>=N.hall?'ok':'warn',`${s.name}: ancho ${f2(ms)} m (accesible ${f2(N.hall)} m)`,{s})});

function niceRange(a,b,step){return[Math.floor(a/step)*step,Math.ceil(b/step)*step]}

  if(sub)ET(svg,key+'.sub',sub,{x:W-m.r,y:18,'text-anchor':'end','font-size':11,fill:P.muted,'font-family':F});
  for(let v=y0;v<=y1+1e-9;v+=step){E('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:P.line2,'stroke-width':1},svg);E('text',{x:m.l-6,y:Y(v)+4,'text-anchor':'end','font-size':10.5,fill:P.muted,'font-family':F,text:v+unit},svg)}

}

/* ================= 5 · Programa y relaciones ================= */
const RELW=()=>({2:+S.style.rel.w2||0,1:+S.style.rel.w1||0,0:0});
const relOf=(a,b)=>S.rel[relKey(a,b)]||0;
function weightOf(id){const w=RELW();let t=0;S.spaces.forEach(s=>{if(s.id!==id)t+=w[relOf(id,s.id)]});return t}
function sortedSpaces(){return S.spaces.slice().sort((a,b)=>(ZONE_KEYS.indexOf(a.zone)-ZONE_KEYS.indexOf(b.zone))||a.level-b.level)}
function newId(){let i=1;while(S.spaces.some(s=>s.id==='E'+i))i++;return 'E'+i}
const DW=640,DH=900;
function nodeR(s){const B=S.style.bubble;if(s.r)return +s.r;const lo=+B.minR||22,hi=+B.maxR||52;return B.sizeBy==='area'?clamp(Math.sqrt(s.area||4)*7.5,lo,hi):B.sizeBy==='igual'?(lo+hi)/2:clamp(lo-4+Math.sqrt(weightOf(s.id))*3.6,lo,hi)}
function nodeShape(g,shape,r,attrs){if(shape==='square'||shape==='rounded'){const k=r*0.9;return E('rect',{x:-k,y:-k,width:2*k,height:2*k,rx:shape==='rounded'?k*0.35:0,...attrs},g)}
  if(shape==='hex'){const p=[];for(let i=0;i<6;i++){const a=rad(60*i+30);p.push([Math.cos(a)*r,Math.sin(a)*r])}return E('polygon',{points:pts(p),...attrs},g)}
  if(shape==='ellipse')return E('ellipse',{cx:0,cy:0,rx:r*1.25,ry:r*0.8,...attrs},g);
  if(shape==='diamond'){const k=r*1.18;return E('polygon',{points:pts([[0,-k],[k,0],[0,k],[-k,0]]),...attrs},g)}

function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

function massItems(){return S.spaces.filter(s=>s.geo&&s.geo.length>=3).map(s=>({id:s.id,pts:s.geo,z:+s.z||0,h:s.h==null?2.8:+s.h,color:spColor(s),flat:(s.h??2.8)<0.1,level:s.level}))}
function houseBox(){const it=massItems().filter(i=>!i.flat&&i.level===0);if(!it.length)return null;const b=bbox(it.flatMap(i=>i.pts));const h=Math.max(...it.map(i=>i.z+i.h));return{...b,hgt:h}}
/* Isométrico: el observador mira desde la esquina de menor x+y después de girar la vista. */
function drawIso(svg,P,fr,o){
  const lotW=S.project.lotW,N=+S.project.northDeg||0;const Ymax=o.Ymax;const c=[o.cx??lotW/2,o.cy??Ymax/2];const th=rad(-(o.view||0)*90);
  const rot=([x,y])=>{const dx=x-c[0],dy=y-c[1];return[dx*Math.cos(th)-dy*Math.sin(th),dx*Math.sin(th)+dy*Math.cos(th)]};
  const iso=(p,z)=>{const[x,y]=rot(p);return[(x-y)*0.866,-(x+y)*0.5-z]};
  let sd=null,su=null;if(o.sun&&o.sun.alt>2){su=[Math.sin(rad(o.sun.az+N)),Math.cos(rad(o.sun.az+N))];const t=1/Math.tan(rad(o.sun.alt));sd=[-su[0]*t,-su[1]*t]}
  const items=o.items.map(it=>({...it,pts:it.pts.map(([x,y])=>[x,Math.min(y,Ymax)])})).filter(it=>bbox(it.pts).h>0.01);const ground=o.ground||[[0,0],[lotW,0],[lotW,Ymax],[0,Ymax]];
  // límites
  const all=[];ground.forEach(p=>all.push(iso(p,0)));items.forEach(it=>it.pts.forEach(p=>{all.push(iso(p,it.z));all.push(iso(p,it.z+it.h))}));
  const b=bbox(all);const s=Math.min(fr.w/b.w,fr.h/b.h)*0.94;const ox=fr.x+fr.w/2-(b.x0+b.w/2)*s,oy=fr.y+fr.h/2-(b.y0+b.h/2)*s;
  const T=(p,z)=>{const q=iso(p,z);return[ox+q[0]*s,oy+q[1]*s]};
  const pen=o.style==='pen';const ink=P.ink;
  E('polygon',{points:pts(ground.map(p=>T(p,0))),fill:pen?P.bg:P.ground,stroke:ink,'stroke-width':pen?1:0.8},svg);
  items.filter(i=>i.flat).forEach(it=>E('polygon',{points:pts(it.pts.map(p=>T(p,it.z+it.h))),fill:pen?P.bg:it.color,'fill-opacity':pen?1:.5,stroke:ink,'stroke-width':.5},svg));
  const MS=S.style.mass;if(sd&&!pen){const g=E('g',{opacity:MS.shadow},svg);const ink=inkOr(MS.shadowColor,P);items.filter(i=>!i.flat).forEach(it=>{const o1=[sd[0]*it.z,sd[1]*it.z],o2=[sd[0]*(it.z+it.h),sd[1]*(it.z+it.h)];const sh=(p,o)=>T([p[0]+o[0],p[1]+o[1]],0);
    E('polygon',{points:pts(it.pts.map(p=>sh(p,o2))),fill:ink},g);if(it.z>0)E('polygon',{points:pts(it.pts.map(p=>sh(p,o1))),fill:ink},g);
    it.pts.forEach((p,i)=>{const q=it.pts[(i+1)%it.pts.length];E('polygon',{points:pts([sh(p,o1),sh(q,o1),sh(q,o2),sh(p,o2)]),fill:ink},g)})})}
  const solids=items.filter(i=>!i.flat).map(it=>{const cc=polyCentroid(it.pts);const r=rot(cc);return{...it,key:r[0]+r[1]-3*it.z}}).sort((a,b)=>b.key-a.key);
  solids.forEach(it=>{const p=it.pts;const ccw=signedArea(p)>0;const walls=[];
    for(let i=0;i<p.length;i++){const a=p[i],q=p[(i+1)%p.length];const dx=q[0]-a[0],dy=q[1]-a[1];const L=Math.hypot(dx,dy)||1;const n=ccw?[dy/L,-dx/L]:[-dy/L,dx/L];const nr=rot([n[0]+c[0],n[1]+c[1]]);
      if(nr[0]+nr[1]<-1e-6){const m=rot([(a[0]+q[0])/2,(a[1]+q[1])/2]);walls.push({a,q,n,depth:m[0]+m[1]})}}
    walls.sort((x,y)=>y.depth-x.depth).forEach(w=>{const lit=su?(w.n[0]*su[0]+w.n[1]*su[1])>0:false;const col=pen?P.bg:lit?mix(it.color,'#FFFFFF',+MS.wallLight):mix(it.color,'#16212B',+MS.wallDark);
      E('polygon',{class:'shp',points:pts([T(w.a,it.z),T(w.q,it.z),T(w.q,it.z+it.h),T(w.a,it.z+it.h)]),fill:col,stroke:MS.edges===false&&!pen?col:ink,'stroke-width':pen?1.1:.7,'stroke-linejoin':'round'},svg)});
    E('polygon',{points:pts(p.map(q=>T(q,it.z+it.h))),fill:pen?P.bg:mix(it.color,'#FFFFFF',.08),stroke:MS.edges===false&&!pen?mix(it.color,'#FFFFFF',.08):ink,'stroke-width':pen?1.1:.7,'stroke-linejoin':'round'},svg)});
  return{T,s};
}

function drawNet(svg,P,fr,hb){const F=P.font;const w=hb.w,l=hb.h,h=Math.min(hb.hgt,3);const TW=w+2*h,TL=l+2*h;const s=Math.min(fr.w/TW,fr.h/TL)*0.9;const ox=fr.x+(fr.w-TW*s)/2,oy=fr.y+(fr.h-TL*s)/2;

function drawZoneMini(svg,P,fr,hb){const pad=0.4;const x0=hb.x0-pad,y0=hb.y0-pad,w=hb.w+2*pad,l=hb.h+2*pad;const s=Math.min(fr.w/w,fr.h/l);const ox=fr.x+(fr.w-w*s)/2,oy=fr.y+(fr.h-l*s)/2;const X=x=>ox+(x-x0)*s,Y=y=>oy+(y0+l-y)*s;

function variantData(){const d=JSON.parse(JSON.stringify(S));delete d.variants;if(d.zoning)d.zoning.bg=null;if(d.board)d.board.els=d.board.els.filter(e=>e.type!=='image');return d}
function variantStats(d){const cur=S;S=d;let r;try{syncDerived();const mm=zoneMetrics();const rc=relChecks();const ch=normChecks();const c=cost();r={pb:mm.pb,total:mm.total,cos:mm.cos,cus:mm.cus,cas:mm.cas,rel:rc.length?rc.filter(x=>x.ok).length+'/'+rc.length:'—',norm:ch.length?Math.round(ch.filter(x=>x.st==='ok').length/ch.length*100)+' %':'—',bad:ch.filter(x=>x.st==='bad').length,costo:c.total,heat:envelope().perM2}}catch(e){r=null}S=cur;syncDerived();return r}
function openVariants(){const b=H(`<div><p style="margin-top:0">Guarda la versión actual como variante, prueba otra distribución y compáralas lado a lado. Puedes guardar hasta 8.</p><div class="row"><button class="btn sm pri" id="vaSave" type="button">Guardar la versión actual como variante</button></div><div id="vaT" style="margin-top:12px"></div></div>`);
  const m=modal('Variantes',b,{wide:true});
  const render=()=>{const V=S.variants||[];const now=variantStats(variantData());const cols=[{name:'Actual',st:now,cur:true},...V.map(v=>({v,name:v.name,st:variantStats(JSON.parse(JSON.stringify(v.data)))}))];
    const row=(l,f)=>`<tr><td>${l}</td>${cols.map(c=>`<td>${c.st?f(c.st):'—'}</td>`).join('')}</tr>`;
    $('#vaT',b).innerHTML=V.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>
      ${row('Planta baja m²',s=>f2(s.pb))}${row('Total construido m²',s=>f2(s.total))}${row('COS',s=>f2(s.cos))}${row('CUS',s=>f2(s.cus))}${row('CAS',s=>f2(s.cas))}${row('Relaciones fuertes que colindan',s=>s.rel)}${row('Normativa que cumple',s=>s.norm)}${row('Observaciones graves',s=>s.bad)}${row('Calor de envolvente W/m²',s=>f0(s.heat))}${row('Costo estimado',s=>mxn(s.costo))}
      <tr><td></td><td></td>${V.map(v=>`<td><div class="row"><button class="btn sm" data-open="${v.id}" type="button">Abrir</button><button class="btn sm ghost" data-ren="${v.id}" type="button">Renombrar</button><button class="btn sm ghost" data-del="${v.id}" type="button">✕</button></div><div class="hint">${esc(v.date)}</div></td>`).join('')}</tr></tbody></table></div>`:'<p class="hint">Todavía no hay variantes guardadas.</p>';
    $$('[data-open]',b).forEach(x=>x.onclick=()=>{const v=S.variants.find(q=>q.id===x.dataset.open);const keep=S.variants;const d=JSON.parse(JSON.stringify(v.data));d.variants=keep;m.close();replaceProject(d,'Variante abierta: '+v.name+'. Deshacer la regresa.')});
    $$('[data-del]',b).forEach(x=>x.onclick=()=>{S.variants=S.variants.filter(q=>q.id!==x.dataset.del);changed();render()});
    $$('[data-ren]',b).forEach(x=>x.onclick=()=>{const v=S.variants.find(q=>q.id===x.dataset.ren);editPopover(x,v.name,val=>{if(val&&val.trim()){v.name=sStr(val.trim(),60);changed();render()}})})};
  $('#vaSave',b).onclick=()=>{S.variants=S.variants||[];if(S.variants.length>=8)return toast('Máximo 8 variantes: borra una primero');S.variants.push({id:uid('v'),name:'Variante '+String.fromCharCode(65+S.variants.length),date:new Date().toLocaleString('es-MX'),data:variantData()});changed();render();toast('Variante guardada')};render()}
function references(){const C=S.climate,L=[];const y=new Date().getFullYear();
  if(C.loc){L.push(`Zippenfenig, P. (2023). Open-Meteo.com Weather API [Software]. Zenodo. https://doi.org/10.5281/zenodo.7970649 (datos de ${C.loc.place}, ${C.loc.y0}–${C.loc.y1}, consultados el ${fmtYmd(C.loc.at)})`);
    L.push(`Hersbach, H., Bell, B., Berrisford, P., Hirahara, S., Horányi, A., Muñoz-Sabater, J., … Thépaut, J.-N. (2020). The ERA5 global reanalysis. Quarterly Journal of the Royal Meteorological Society, 146(730), 1999–2049. https://doi.org/10.1002/qj.3803`)}
  else if(/smn|conagua/i.test(C.source))L.push(`Servicio Meteorológico Nacional. (s. f.). Información estadística climatológica. Comisión Nacional del Agua. https://smn.conagua.gob.mx`);
  else if(C.source)L.push(C.source);
  if(C.epw)L.push(`Crawley, D., & Lawrie, L. (s. f.). Repository of free climate data for building performance simulation [Archivo EPW: ${C.epw.name}]. https://climate.onebuilding.org`);
  if(C.loc){}else if(/windfinder/i.test(C.windSource))L.push(`Windfinder. (s. f.). Estadísticas de viento y clima. https://www.windfinder.com`);else if(C.windSource)L.push(C.windSource);
  L.push(`GeoNames. (s. f.). GeoNames geographical database [Base de datos]. https://www.geonames.org`);L.push(`Natural Earth. (s. f.). Admin 1 – States, provinces [Datos vectoriales, 1:10m]. https://www.naturalearthdata.com`);
  L.push(`NOAA Global Monitoring Laboratory. (s. f.). General solar position calculations. National Oceanic and Atmospheric Administration. https://gml.noaa.gov/grad/solcalc/solareqns.PDF`);
  L.push(`ASHRAE. (2020). ANSI/ASHRAE Standard 55-2020: Thermal environmental conditions for human occupancy. ASHRAE.`);
  if(S.openings.length||S.spaces.some(s=>s.geo))L.push(`Gobierno de la Ciudad de México. (s. f.). Normas técnicas complementarias para el proyecto arquitectónico. Gaceta Oficial de la Ciudad de México.`);
  L.push(`Secretaría de Energía. (2011). NOM-020-ENER-2011. Eficiencia energética en edificaciones: envolvente de edificios para uso habitacional. Diario Oficial de la Federación.`);
  L.push(`Haurwitz, B. (1945). Insolation in relation to cloudiness and cloud density. Journal of Meteorology, 2(3), 154–166.`);
  (S.refs||[]).forEach(r=>L.push(r));return[...new Set(L)].sort((a,b)=>a.localeCompare(b,'es'))}

async function checkUpdates(manual){if(!canCheck()){if(manual)toast('La búsqueda de actualizaciones funciona en la página publicada en internet');return null}
  UPD.last=Date.now();try{const res=await fetch('version.json?t='+Date.now(),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',redirect:'error'});if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();if(txt.length>20000)throw new Error('archivo demasiado grande');const r=cleanRemote(JSON.parse(txt));if(!r)throw new Error('formato');UPD.remote=r;updBell();
    if(r.aviso)avisoBar(r.aviso);if(verCmp(r.version,APP.version)>0){if(!UPD.dismissed||manual)updBar(r)}else if(manual)toast(`Tienes la versión más reciente (${APP.version})`);return r}
  catch(e){if(manual)toast('No se pudo revisar ahora. Intenta más tarde.');return null}}
function initUpdates(){try{const u=new URL(location.href);if(u.searchParams.has('v')){u.searchParams.delete('v');history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}
  seenVersion();if(!canCheck())return;setTimeout(()=>checkUpdates(false),2500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-UPD.last>30*60e3)checkUpdates(false)});setInterval(()=>{if(document.visibilityState==='visible')checkUpdates(false)},60*60e3)}

/* ---------- Campanita de notificaciones e historial ---------- */
function notiSeen(){try{const a=JSON.parse(localStorage.getItem(NOTI_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function notiItems(){const it=[{id:'v'+APP.version,kind:'version'}];const r=UPD.remote;if(r&&verCmp(r.version,APP.version)>0)it.unshift({id:'u'+r.version,kind:'update'});if(r&&r.aviso)it.unshift({id:'a'+r.aviso.id,kind:'aviso'});return it}
function updBell(){const d=$('#bellDot');if(!d)return;const seen=notiSeen();const n=notiItems().filter(x=>!seen.includes(x.id)).length;d.hidden=!n;const b=$('#btnBell');if(b)b.setAttribute('aria-label',n?`Notificaciones: ${n} sin ver`:'Notificaciones')}
function markNoti(){const seen=new Set(notiSeen());notiItems().forEach(x=>seen.add(x.id));try{localStorage.setItem(NOTI_KEY,JSON.stringify([...seen].slice(-60)))}catch(e){}updBell()}
function openBell(){const r=UPD.remote;const up=r&&verCmp(r.version,APP.version)>0;
  const b=H(`<div>${up?`<div class="noti up"><b>Hay una versión nueva (${esc(r.version)})</b><p class="hint" style="margin:4px 0 8px">Tu proyecto se conserva al actualizar.</p><button class="btn sm pri" type="button" data-n="go">Actualizar ahora</button></div>`:''}
    ${r&&r.aviso?`<div class="noti ${r.aviso.level}"><b>Aviso</b><p class="avt" style="margin:4px 0 0;white-space:pre-line"></p></div>`:''}
    <div class="noti"><b>Novedades de tu versión</b><div style="margin-top:6px">${notesHTML(APP.version,APP.date,APP.notes,APP.fixes)}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-n="hist">Todas las notas de actualización</button>${canCheck()?'<button class="btn sm ghost" type="button" data-n="chk">Buscar actualizaciones</button>':''}</div></div>`);
  const av=$('.avt',b);if(av)av.textContent=r.aviso.text;const m=modal('Notificaciones',b);markNoti();
  $$('[data-n]',b).forEach(x=>x.onclick=()=>{const k=x.dataset.n;if(k==='go'){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}const u=new URL(location.href);u.searchParams.set('v',r.version);location.replace(u.toString())}
    if(k==='hist'){m.close();openHistory()}if(k==='chk')checkUpdates(true).then(()=>{m.close();openBell()})})}
function openHistory(){const all=[{version:APP.version,date:APP.date,notes:APP.notes,fixes:APP.fixes},...APP.history.filter(h=>h.version!==APP.version)];
  modal('Notas de actualización',H(`<div class="hist">${all.map((h,i)=>`<section${i?'':' class="cur"'}>${notesHTML(h.version,h.date,h.notes,h.fixes)}${i?'':'<span class="badge">Tu versión</span>'}</section>`).join('')}</div>`))}

function readAvatar(f,cb){if(!f||!/^image\//.test(f.type))return toast('Elige una imagen (JPG, PNG o WEBP)');if(f.size>15e6)return toast('La imagen pesa demasiado');const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>cropAvatar(img,cb);img.onerror=()=>toast('No pude leer esa imagen');img.src=String(r.result)};r.readAsDataURL(f)}
/* Recorte de la foto de perfil: arrastrar para acomodar y acercar con la barra o la rueda. */
function cropAvatar(img,cb){const N=520,CR=236;const b=H(`<div class="crop"><canvas width="${N}" height="${N}" aria-label="Vista previa del recorte"></canvas><label class="f" style="margin-top:10px">Acercar<input type="range" min="1" max="4" step="0.01" value="1"></label><p class="hint">Arrastra la foto para acomodarla dentro del círculo.</p><div class="row" style="justify-content:flex-end"><button class="btn sm" type="button" data-c="x">Cancelar</button><button class="btn sm pri" type="button" data-c="ok">Usar esta foto</button></div></div>`);
  const m=modal('Ajusta tu foto',b);const cv=$('canvas',b),x=cv.getContext('2d'),rg=$('input',b);const base=Math.max(N/img.width,N/img.height);let z=1,ox=0,oy=0;
  const lim=()=>{const w=img.width*base*z,h=img.height*base*z;ox=clamp(ox,-(w-N)/2-(N/2-CR),(w-N)/2+(N/2-CR));oy=clamp(oy,-(h-N)/2-(N/2-CR),(h-N)/2+(N/2-CR));return[w,h]};
  const draw=()=>{const[w,h]=lim();x.clearRect(0,0,N,N);x.drawImage(img,N/2-w/2+ox,N/2-h/2+oy,w,h);x.fillStyle='rgba(12,18,24,.6)';x.beginPath();x.rect(0,0,N,N);x.arc(N/2,N/2,CR,0,Math.PI*2);x.fill('evenodd');x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(N/2,N/2,CR,0,Math.PI*2);x.stroke()};
  let drag=null;cv.style.touchAction='none';cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const k=N/cv.clientWidth;ox+=(e.clientX-drag.x)*k;oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()});
  const up=()=>drag=null;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();z=clamp(z*Math.exp(-e.deltaY*0.0015),1,4);rg.value=z;draw()},{passive:false});rg.addEventListener('input',()=>{z=+rg.value;draw()});
  $('[data-c=x]',b).onclick=()=>m.close();$('[data-c=ok]',b).onclick=()=>{const[w,h]=lim();const o=document.createElement('canvas');o.width=o.height=256;const k=256/(2*CR);const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,256,256);
    c.drawImage(img,(N/2-w/2+ox-(N/2-CR))*k,(N/2-h/2+oy-(N/2-CR))*k,w*k,h*k);m.close();cb(o.toDataURL('image/jpeg',0.88))};draw()}

  <label class="f" for="rpT">Tipo<select id="rpT"><option>Error</option><option>Algo se ve mal</option><option>Idea o mejora</option><option>Dato incorrecto</option></select></label>
  <label class="f" for="rpV">Apartado<input id="rpV" value="${esc(vw)}" maxlength="40"></label></div>
  <label class="chk" style="margin-top:8px"><input type="checkbox" id="rpI" checked> Incluir datos técnicos (navegador, pantalla y errores registrados; no incluye tu proyecto ni tu perfil)</label>
  <div class="row" style="margin-top:12px">${REPORT.email?'<button class="btn sm pri" id="rpMail" type="button">Enviar por correo</button>':''}${REPORT.url?'<button class="btn sm pri" id="rpForm" type="button">Abrir formulario</button>':''}<button class="btn sm" id="rpCopy" type="button">Copiar reporte</button><button class="btn sm" id="rpDl" type="button">Descargar .txt</button></div>
  <p class="hint">${REPORT.email||REPORT.url?'':'Copia el reporte y mándalo por el medio que uses para comunicarte con quien administra esta página.'}</p></div>`);
  const m=modal('Reportar un error',b,{wide:true});
  const text=()=>{const t=[`Tipo: ${$('#rpT',b).value}`,`Apartado: ${$('#rpV',b).value}`,`Qué pasó: ${$('#rpW',b).value}`,`Pasos: ${$('#rpS',b).value}`];
    if($('#rpI',b).checked)t.push('','Datos técnicos:',`Navegador: ${navigator.userAgent}`,`Pantalla: ${innerWidth}×${innerHeight} @${devicePixelRatio}`,`Táctil: ${matchMedia('(pointer:coarse)').matches?'sí':'no'}`,`Fecha: ${new Date().toISOString()}`,`Errores: ${ERRLOG.length?ERRLOG.map(e=>e.t+' '+e.m+' '+(e.s||'')).join(' | '):'ninguno'}`);return t.join('\n')};
  $('#rpCopy',b).onclick=async()=>{try{await navigator.clipboard.writeText(text());toast('Reporte copiado')}catch(e){const ta=$('#rpW',b);ta.value=text();ta.select();toast('Selecciona y copia el texto')}};
  $('#rpDl',b).onclick=()=>saveFile('reporte_taller_de_sitio.txt',new Blob([text()],{type:'text/plain'}));
  if(REPORT.email)$('#rpMail',b).onclick=()=>{location.href='mailto:'+encodeURIComponent(REPORT.email)+'?subject='+encodeURIComponent('Reporte Taller de Sitio: '+$('#rpT',b).value)+'&body='+encodeURIComponent(text().slice(0,1800))};
  if(REPORT.url&&/^https:\/\//.test(REPORT.url))$('#rpForm',b).onclick=()=>{const a=document.createElement('a');a.href=REPORT.url;a.target='_blank';a.rel='noopener noreferrer';a.click()};
  setTimeout(()=>$('#rpW',b).focus(),50)}
function shortcuts(){modal('Atajos de teclado',H(`<div class="tbl-wrap"><table class="t"><tbody>
  ${[['Ctrl + Z','Deshacer'],['Ctrl + Y  /  Ctrl + Shift + Z','Rehacer'],['Ctrl + S','Guardar proyecto'],['Ctrl + O','Abrir archivo'],['Ctrl + E','Exportar'],['Ctrl + rueda / dos dedos','Acercar y alejar dibujos'],['Arrastrar el fondo','Mover la vista'],['Flechas (Shift = más)','Mover lo seleccionado'],['Supr','Borrar lo seleccionado'],['Ctrl + D','Duplicar'],['Esc','Soltar selección o cancelar'],['V R P T F C','Herramientas de zonificación'],['[  ]','Mandar atrás o al frente (lámina)']].map(([k,d])=>`<tr><td class="txt num">${esc(k)}</td><td class="txt">${esc(d)}</td></tr>`).join('')}</tbody></table></div>`))}
function updModeMenu(){const b=$('#mMode');if(b)b.textContent=isSimple()?'Cambiar a modo completo':'Cambiar a modo sencillo'}
function boot(){
  restoreState();applyPrefs();applyMode();updModeMenu();$('#btnBell').onclick=openBell;$$('[data-mode-set]').forEach(b=>b.onclick=()=>{setMode(b.dataset.modeSet);updModeMenu()});buildRail();syncDerived();updAvatar();$('#btnProfile').onclick=()=>settings('perfil');const setTopH=()=>document.documentElement.style.setProperty('--top-h',$('.top').offsetHeight+'px');setTopH();addEventListener('resize',setTopH);
  const pn=$('#projName');pn.value=S.project.name;pn.addEventListener('change',()=>{S.project.name=pn.value.trim()||'Proyecto';changed();rerender()});
  $('#btnSave').onclick=saveProject;$('#btnOpen').onclick=()=>$('#fileAny').click();$('#btnExport').onclick=openExport;
  $('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
  $('#fileAny').addEventListener('change',e=>{const f=e.target.files[0];if(f)openAny(f);e.target.value=''});
  $('#fileEpw').addEventListener('change',e=>{const f=e.target.files[0];if(f)readEpwFile(f);e.target.value=''});
  $('#fileImg').addEventListener('change',e=>{const f=e.target.files[0];if(f)importImage(f);e.target.value=''});
  const mb=$('#btnMore'),mm=$('#moreMenu');const closeM=()=>{mm.hidden=true;document.removeEventListener('pointerdown',outM)};const outM=e=>{if(!mm.contains(e.target)&&e.target!==mb)closeM()};
  mb.onclick=()=>{mm.hidden=!mm.hidden;if(!mm.hidden)setTimeout(()=>document.addEventListener('pointerdown',outM),0)};
  let armedNew=0;$$('[data-m]',mm).forEach(b=>b.onclick=()=>{const k=b.dataset.m;
    if(k==='new'){if(Date.now()-armedNew<3500){closeM();replaceProject(blankProject(),'Proyecto nuevo');location.hash='sitio';b.textContent='Proyecto nuevo'}else{armedNew=Date.now();b.textContent='¿Empezar de cero? Toca otra vez';setTimeout(()=>b.textContent='Proyecto nuevo',3500)}return}
    closeM();if(k==='hist'){openHistory();return}if(k==='mode'){setMode(isSimple()?'full':'simple');updModeMenu();return}if(k==='example')replaceProject(exampleProject(),'Proyecto de ejemplo cargado. Usa Deshacer para volver al tuyo.');if(k==='tut'&&current&&current.tutorial)runTutorial(current);if(k==='settings')settings('apariencia');if(k==='report')openReport();if(k==='variants')openVariants();if(k==='refs')openRefs();if(k==='open')$('#fileAny').click();if(k==='save')saveProject();if(k==='help')shortcuts();
    if(k==='theme'){const r=document.documentElement;const d=isDark();r.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem(STORE+'-theme',d?'light':'dark')}catch(e){}rerender()}});
  try{const t=localStorage.getItem(STORE+'-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>rerender());
  document.addEventListener('keydown',e=>{const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');const mod=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
    if(mod&&k==='s'){e.preventDefault();saveProject();return}if(mod&&k==='o'){e.preventDefault();$('#fileAny').click();return}if(mod&&k==='e'){e.preventDefault();openExport();return}
    if(typing||document.querySelector('.modal-bg,.tut,.pop'))return;
    if(mod&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return}if(mod&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}
    if(current&&current.onKey&&current.onKey(e))e.preventDefault()});
  document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
  document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('.drop'))return;const f=e.dataTransfer&&e.dataTransfer.files[0];if(f){e.preventDefault();openAny(f)}});
  if(!location.hash){try{const t=localStorage.getItem(STORE+'-tab');if(t&&VIEWS.some(v=>v.id===t))history.replaceState(null,'','#'+t)}catch(e){}}
  addEventListener('hashchange',route);histInit();route();
  if(FIRST_RUN)setTimeout(welcome,200);
  initUpdates();
}
boot();

</script>
</body></html>
